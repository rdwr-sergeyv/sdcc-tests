# ── Canonical backend node names — SINGLE SOURCE OF TRUTH ──
# These two anchors are the only place backend names are defined. Every service
# below references them via *hybrid-backend-name / *monitor-backend-name; do not
# hardcode names anywhere else. Override per-host with the env vars if needed.
x-backend-names:
  hybrid:  &hybrid-backend-name  ${SDCC_HYBRID_BACKEND_NAME:-docker}
  monitor: &monitor-backend-name ${SDCC_MONITOR_BACKEND_NAME:-docker-monitor}

x-portal-build: &portal-build
  context: .
  dockerfile: Dockerfile
  additional_contexts:
    sdcc-src: ${SDCC_REPO_PATH:-../../../sdcc}
    sdcc-portal-src: ${SDCC_PORTAL_REPO_PATH:-../../../sdcc-portal}

x-device-templates-volume: &device-templates-volume
  type: bind
  source: ${SDCC_DEVICE_TEMPLATES_PATH:-../../../sdcc/sdcc/provisioning/device_templates/default}
  target: /var/lib/sdcc/core/device_templates
  read_only: true

x-common-environment: &common-environment
  SDCC_DOCKER_BOOTSTRAP_DB: "1"
  SDCC_MONGO_HOST: ${SDCC_MONGO_HOST:-mongo}
  SDCC_MONGO_PORT: ${SDCC_MONGO_PORT:-27017}
  SDCC_MONGO_DB: ${SDCC_MONGO_DB:-sdcc}
  SDCC_PORTAL_PUBLIC_URL: ${SDCC_PORTAL_PUBLIC_URL:-http://localhost:8000}
  SDCC_DEMO_BYPASS_LICENSE: ${SDCC_DEMO_BYPASS_LICENSE:-1}

x-portal-environment: &portal-environment
  <<: *common-environment
  SDCC_BACKEND_NAME: *hybrid-backend-name
  SDCC_BACKEND_IP: ${SDCC_BACKEND_IP:-127.0.0.1}
  SDCC_BACKEND_ROLE: ${SDCC_BACKEND_ROLE:-hybrid}
  # `build` builds the commands and contacts no device; `provisioning` builds and executes.
  # Defaults to the safe one -- this compose file is a test harness, and an accidental
  # provisioning run reconfigures real devices.
  SDCC_TASK_TYPE: ${SDCC_TASK_TYPE:-build}
  # Swappable supervisord profile (file under supervisor/). Only one profile exists for the
  # portal today ("portal"); the var mirrors the backend nodes' SDCC_HYBRID_PROFILE /
  # SDCC_MONITOR_PROFILE for symmetry and host override.
  SDCC_SUPERVISOR_PROFILE: ${SDCC_PORTAL_PROFILE:-portal}

x-portal-service-base: &portal-service-base
  build: *portal-build
  ports:
    - "${LEGACY_PORTAL_PORT:-8000}:8000"
  volumes:
    - *device-templates-volume
    - type: bind
      source: ./supervisor
      target: /etc/sdcc/supervisor
      read_only: true
  # Run the Django dev server under supervisord (like the backend nodes) so the portal's
  # Python code can be reloaded with `supervisorctl restart portal` after a `docker cp`,
  # instead of a full image rebuild. The ENTRYPOINT still runs first (writes sdcc.conf +
  # bootstraps the DB), then execs this command -- same pattern as backend-hybrid /
  # backend-monitor. ${...} resolves against the host/.env only (not the service environment
  # block), so interpolate SDCC_PORTAL_PROFILE directly.
  command: ["/bin/sh", "-c", "exec supervisord -c /etc/sdcc/supervisor/${SDCC_PORTAL_PROFILE:-portal}.conf"]

x-hybrid-backend-environment: &hybrid-backend-environment
  <<: *common-environment
  # SDCC_BACKEND_NAME is intentionally NOT set here — this anchor is shared by both
  # backend-hybrid and backend-monitor, which each set their own name from the
  # canonical *hybrid-backend-name / *monitor-backend-name anchors at the top.
  SDCC_BACKEND_IP: ${SDCC_BACKEND_IP:-10.20.4.20}
  SDCC_BACKEND_ROLE: hybrid
  SDCC_TASK_TYPE: ${SDCC_TASK_TYPE:-build}

# ONE profile, and one variable.
#
#   DP_ISOLATE_COMPOSE_PROFILE=lab   mongo + portal + backend-hybrid + backend-monitor.
#                                    This is the stack. It is what .env sets and what you want.
#   SDCC_TASK_TYPE=build             build the commands, contact no device  (default)
#   SDCC_TASK_TYPE=provisioning      build AND execute them on the devices
#
# The task type used to be a second portal service selected by a second profile. It is not a
# topology choice -- it is one environment variable -- so it is one now, and note it only
# governs AUTOMATIC diversions: a manual action takes its type from the caret in the UI.
#
# `internal-mongo` starts mongo alone, for a portal run outside compose. That is the only other
# profile.
#
# Removed 2026-08-15: the `minimal` and `full` scopes and their 45 per-module containers -- one
# service per backend module, an alternative to running the same modules under supervisord in
# backend-hybrid / backend-monitor, which is what the lab does. Nobody used them, and `full` was
# the profile that deleted both backend nodes as orphans on 2026-08-11.

x-backend-service: &backend-service
  build: *portal-build
  restart: unless-stopped
  volumes:
    - *device-templates-volume

services:
  mongo:
    image: ${LEGACY_PORTAL_MONGO_IMAGE:-mongo:8.2}
    profiles:
      - internal-mongo
      - lab
    ports:
      - "${LEGACY_PORTAL_MONGO_PORT:-27018}:27017"
    volumes:
      - type: bind
        source: ${LEGACY_PORTAL_MONGO_DB_PATH:-../../.tmp/legacy-portal-mongo-db}
        target: /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One portal, whichever scope you pick. The build/execute choice is SDCC_TASK_TYPE, not a
  # separate service: `build` builds the commands without touching a device, `provisioning`
  # builds and executes them. There used to be a second service, portal-build, that existed
  # only to hardcode that one variable -- which cost a profile, made "which portal is running?"
  # a real question, and could not be combined with the lab scope because both published the
  # same port.
  portal:
    <<: *portal-service-base
    profiles:
      - lab
    environment:
      <<: *portal-environment

  backend-hybrid:
    <<: *backend-service
    profiles:
      - lab
    environment:
      <<: *hybrid-backend-environment
      SDCC_BACKEND_NAME: *hybrid-backend-name
      SDCC_BACKEND_ROLE: hybrid
      # Backends.ip_addr has a unique index, so each backend container needs a
      # distinct IP. This value is only used by SdccServiceManager for SSH
      # orchestration (not used in this container lab), so it's a placeholder.
      # Use a loopback addr like the other local backends (docker-monitor=127.0.0.3,
      # docker-main=127.0.0.2) rather than squatting a real lab-subnet IP.
      SDCC_BACKEND_IP: 127.0.0.4
      # Swappable supervisord profile (file under supervisor/): minimal-hybrid
      # (cmd-executor + incident-manager) or full-hybrid (all backend services).
      # Per-backend host override, e.g. SDCC_HYBRID_PROFILE=full-hybrid.
      SDCC_SUPERVISOR_PROFILE: ${SDCC_HYBRID_PROFILE:-minimal-hybrid}
      # NOTE: the command below interpolates SDCC_HYBRID_PROFILE directly, NOT
      # SDCC_SUPERVISOR_PROFILE. Compose ${...} interpolation resolves against the
      # host shell / .env only — it cannot see a service's own environment: block,
      # so ${SDCC_SUPERVISOR_PROFILE} would always fall back to the default here.
    command: ["/bin/sh", "-c", "exec supervisord -c /etc/sdcc/supervisor/${SDCC_HYBRID_PROFILE:-minimal-hybrid}.conf"]
    volumes:
      - *device-templates-volume
      - type: bind
        source: ./supervisor
        target: /etc/sdcc/supervisor
        read_only: true

  # Supervised MONITOR backend node (PLAN item 3). Registers as backend "docker-monitor";
  # runs the poller-role programs only (full-monitor profile). No SCs assigned yet,
  # so its pollers sit idle. Per-backend host override: SDCC_MONITOR_PROFILE.
  backend-monitor:
    <<: *backend-service
    profiles:
      - lab
    environment:
      <<: *hybrid-backend-environment
      SDCC_BACKEND_NAME: *monitor-backend-name
      SDCC_BACKEND_ROLE: monitor
      SDCC_BACKEND_IP: 127.0.0.5
      SDCC_SUPERVISOR_PROFILE: ${SDCC_MONITOR_PROFILE:-full-monitor}
      # See backend-hybrid above: interpolate SDCC_MONITOR_PROFILE directly, not
      # the service-internal SDCC_SUPERVISOR_PROFILE (invisible to Compose ${...}).
    command: ["/bin/sh", "-c", "exec supervisord -c /etc/sdcc/supervisor/${SDCC_MONITOR_PROFILE:-full-monitor}.conf"]
    volumes:
      - *device-templates-volume
      - type: bind
        source: ./supervisor
        target: /etc/sdcc/supervisor
        read_only: true
