    environment: *hybrid-backend-environment
    command: ["/bin/sh", "-c", "rm -f /var/lock/sdcc/sdcc-asset-advertisement-aggregator.lck && exec sdcc-asset-advertisement-aggregator.py --debug true"]

  asset-aggregator:
