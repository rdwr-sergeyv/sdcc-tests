    environment: *hybrid-backend-environment
    command: ["/bin/sh", "-c", "rm -f /var/lock/sdcc/sdcc-file-reporter-aggregator.lck && exec sdcc-file-reporter-aggregator.py --debug true"]

  flow-poller:
    <<: *backend-service
    environment: *hybrid-backend-environment
    command: ["/bin/sh", "-c", "rm -f /var/lock/sdcc/sdcc-flow-poller.lck && exec sdcc-flow-poller.py --debug true"]

  health-poller:
    <<: *backend-service
    environment: *hybrid-backend-environment
    command: ["/bin/sh", "-c", "rm -f /var/lock/sdcc/sdcc-health-poller.lck && exec sdcc-health-poller.py --debug true"]

  incident-manager:
    <<: *backend-service
    profiles: *minimal-and-full-profiles
    environment: *hybrid-backend-environment
    command: ["/bin/sh", "-c", "rm -f /var/lock/sdcc/sdcc-incident-manager.lck && exec sdcc-incident-manager.py --debug true"]

  # Supervised backend node: runs multiple sdcc modules under supervisord in one
  # container (PLAN item 1: cmd-executor + incident-manager only, role=hybrid).
  # Registers as backend "docker"; no SCs assigned yet, so it sits idle.
  backend-hybrid:
    <<: *backend-service
    profiles:
      - lab
    environment:
      <<: *hybrid-backend-environment
      SDCC_BACKEND_NAME: *hybrid-backend-name
      SDCC_BACKEND_ROLE: hybrid
      # Backends.ip_addr has a unique index, so each backend container needs a
      # distinct IP. This value is only used by SdccServiceManager for SSH
      # orchestration (not used in this container lab), so it's a placeholder.
      # Use a loopback addr like the other local backends (docker-monitor=127.0.0.3,
      # docker-main=127.0.0.2) rather than squatting a real lab-subnet IP.
      SDCC_BACKEND_IP: 127.0.0.4
      # Swappable supervisord profile (file under supervisor/): minimal-hybrid
      # (cmd-executor + incident-manager) or full-hybrid (all backend services).
      # Per-backend host override, e.g. SDCC_HYBRID_PROFILE=full-hybrid.
      SDCC_SUPERVISOR_PROFILE: ${SDCC_HYBRID_PROFILE:-minimal-hybrid}
      # NOTE: the command below interpolates SDCC_HYBRID_PROFILE directly, NOT
      # SDCC_SUPERVISOR_PROFILE. Compose ${...} interpolation resolves against the
      # host shell / .env only — it cannot see a service's own environment: block,
      # so ${SDCC_SUPERVISOR_PROFILE} would always fall back to the default here.
    command: ["/bin/sh", "-c", "exec supervisord -c /etc/sdcc/supervisor/${SDCC_HYBRID_PROFILE:-minimal-hybrid}.conf"]
    volumes:
      - *device-templates-volume
      - type: bind
        source: ./supervisor
        target: /etc/sdcc/supervisor
        read_only: true

  # Supervised MONITOR backend node (PLAN item 3). Registers as backend "docker-monitor";
  # runs the poller-role programs only (full-monitor profile). No SCs assigned yet,
  # so its pollers sit idle. Per-backend host override: SDCC_MONITOR_PROFILE.
  backend-monitor:
    <<: *backend-service
    profiles:
      - lab
    environment:
      <<: *hybrid-backend-environment
      SDCC_BACKEND_NAME: *monitor-backend-name
      SDCC_BACKEND_ROLE: monitor
      SDCC_BACKEND_IP: 127.0.0.5
      SDCC_SUPERVISOR_PROFILE: ${SDCC_MONITOR_PROFILE:-full-monitor}
      # See backend-hybrid above: interpolate SDCC_MONITOR_PROFILE directly, not
      # the service-internal SDCC_SUPERVISOR_PROFILE (invisible to Compose ${...}).
    command: ["/bin/sh", "-c", "exec supervisord -c /etc/sdcc/supervisor/${SDCC_MONITOR_PROFILE:-full-monitor}.conf"]
    volumes:
      - *device-templates-volume
      - type: bind
        source: ./supervisor
        target: /etc/sdcc/supervisor
        read_only: true

