; Supervisord profile: PORTAL (frontend).
;
; Runs the Django dev server (manage.py runserver) as a supervised program so the
; portal's Python code can be reloaded in place with
;   docker exec legacy-portal-portal-1 supervisorctl restart portal
; after a `docker cp`, instead of rebuilding the image. (Static JS/CSS is served
; straight from disk, so those edits already go live on a browser refresh without
; any restart at all.)
;
; Mirrors the backend profiles (minimal-hybrid.conf etc.): same supervisord +
; supervisorctl socket sections, just a different [include] fragment.
;
; Hand-written — NOT produced by tools/gen-supervisor-fragments.cjs (that generator
; only emits backend worker fragments derived from docker-compose.yml services).

[supervisord]
nodaemon=true
logfile=/var/log/sdcc/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[include]
files = /etc/sdcc/supervisor/conf.d/portal.programs.conf
