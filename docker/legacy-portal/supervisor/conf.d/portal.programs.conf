; Hand-written portal program fragment (see ../portal.conf).
; NOT auto-generated — tools/gen-supervisor-fragments.cjs only emits the backend
; worker fragments, so it leaves this file alone.
;
; The Django dev server keeps its autoreloader (no --noreload), so a `docker cp` of
; a changed .py is picked up automatically; `supervisorctl restart portal` forces a
; clean restart. runserver forks a reloader child, so stop/kill as a group to avoid
; orphaning it on restart.

[program:portal]
command=python manage.py runserver --verbosity 3 0.0.0.0:8000
directory=/opt/cddos-legacy/sdcc-portal/sdcc_portal
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
